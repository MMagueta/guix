// Let LibreWolf derive its scale from Xft.dpi (see ~/.Xresources) like GTK
// does; forcing a value here on top of that makes the UI oversized.
defaultPref("layout.css.devPixelsPerPx", "-1.0");

// Decode video on the GPU through VA-API (intel-media-driver; see
// start-session) to save battery.  That driver has no AV1 decoder, and
// YouTube serves AV1 whenever the browser accepts it, so refuse AV1 and get
// VP9, which the GPU does decode.
defaultPref("media.hardware-video-decoding.force-enabled", true);
defaultPref("media.av1.enabled", false);
